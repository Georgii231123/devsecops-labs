apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: python-service
  title: Secure Python Service
  description: Golden-path service with ownership, CI and hardened Kubernetes defaults
  tags: [python, kubernetes, golden-path]
spec:
  owner: group:platform
  type: service
  parameters:
    - title: Service identity
      required: [name, owner, system]
      properties:
        name:
          title: Service name
          type: string
          pattern: '^[a-z][a-z0-9-]+$'
        owner:
          title: Owner
          type: string
          ui:field: OwnerPicker
          ui:options:
            allowedKinds: [Group]
        system:
          title: System
          type: string
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: System
    - title: Repository
      required: [repoUrl]
      properties:
        repoUrl:
          title: GitHub repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
  steps:
    - id: fetch
      name: Render golden path
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          owner: ${{ parameters.owner }}
          system: ${{ parameters.system }}
    - id: publish
      name: Publish repository
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: Service generated by the internal developer portal
        defaultBranch: main
        protectDefaultBranch: true
        repoVisibility: private
    - id: register
      name: Register component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
