---
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render Docker Compose workload
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ app_directory }}/compose.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart application

- name: Install application systemd unit
  ansible.builtin.template:
    src: platform-app.service.j2
    dest: "/etc/systemd/system/{{ app_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart application

- name: Ensure application is enabled
  ansible.builtin.systemd_service:
    name: "{{ app_name }}"
    state: started
    enabled: true
    daemon_reload: true
