apiVersion: apps/v1
kind: Deployment
metadata:
  name: __SERVICE_SLUG__
  labels:
    app.kubernetes.io/name: __SERVICE_SLUG__
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: __SERVICE_SLUG__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: __SERVICE_SLUG__
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/example/__SERVICE_SLUG__:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: __PORT__
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: __PORT__
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: __PORT__
            periodSeconds: 20
