---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Configure reverse proxy
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/sites-available/platform-app.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Enable reverse proxy site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/platform-app.conf
    dest: /etc/nginx/sites-enabled/platform-app.conf
    state: link
  notify: Reload nginx

- name: Ensure Nginx is enabled
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
