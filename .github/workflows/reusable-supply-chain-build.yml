name: Reusable Supply Chain Builder

on:
  workflow_call:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: supply-chain-security
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify builder toolchain
        run: |
          go version
          python3 scripts/verify_workflow.py

      - name: Unit tests
        run: go test ./...

      - name: Reproducible build gate
        run: bash scripts/reproducible_build.sh

      - name: Verify distributable checksum
        run: sha256sum -c dist/provenance-demo-linux-amd64.sha256

      - name: Install Syft with release checksum verification
        run: |
          SYFT_VERSION=1.50.0
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_checksums.txt"
          grep "syft_${SYFT_VERSION}_linux_amd64.tar.gz$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "syft_${SYFT_VERSION}_linux_amd64.tar.gz" syft
          sudo install -m 0755 syft /usr/local/bin/syft
          rm -f syft "syft_${SYFT_VERSION}_linux_amd64.tar.gz" "syft_${SYFT_VERSION}_checksums.txt"
          syft version

      - name: Generate CycloneDX SBOM
        run: syft dist/provenance-demo -o cyclonedx-json=dist/sbom.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2 / Cosign 3.0.6

      - name: Sign and verify release blob
        env:
          COSIGN_PASSWORD: ""
        run: |
          cosign version
          cosign generate-key-pair --output-key-prefix=/tmp/cosign
          cosign sign-blob --yes --key /tmp/cosign.key --bundle dist/provenance-demo.sigstore.json dist/provenance-demo-linux-amd64.tar.gz
          cosign verify-blob --key /tmp/cosign.pub --bundle dist/provenance-demo.sigstore.json dist/provenance-demo-linux-amd64.tar.gz
          cp /tmp/cosign.pub dist/cosign.pub
          rm -f /tmp/cosign.key /tmp/cosign.pub

      - name: Generate GitHub build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: supply-chain-security/dist/provenance-demo-linux-amd64.tar.gz
          create-storage-record: false

      - name: Upload verification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-evidence
          path: |
            supply-chain-security/dist/provenance-demo-linux-amd64.tar.gz
            supply-chain-security/dist/provenance-demo-linux-amd64.sha256
            supply-chain-security/dist/reproducibility.json
            supply-chain-security/dist/sbom.cdx.json
            supply-chain-security/dist/provenance-demo.sigstore.json
            supply-chain-security/dist/cosign.pub
