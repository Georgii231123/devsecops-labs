apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: enforce-shadow-access
spec:
  podSelector:
    matchLabels:
      runtime-security: enabled
  options:
    - name: policy-mode
      value: enforcement
  lsmhooks:
    - hook: file_open
      message: blocked sensitive file access
      args:
        - index: 0
          type: file
      selectors:
        - matchArgs:
            - index: 0
              operator: Equal
              values:
                - /etc/shadow
          matchActions:
            - action: Sigkill
