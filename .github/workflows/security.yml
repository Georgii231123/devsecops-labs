name: Kubernetes Security Gates

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'policy/**'
      - 'Makefile'
      - '.github/workflows/security.yml'
  pull_request:
    paths:
      - 'k8s/**'
      - 'policy/**'
      - 'Makefile'
      - '.github/workflows/security.yml'

permissions:
  contents: read

env:
  CONFTEST_IMAGE: openpolicyagent/conftest:v0.69.0
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.9

jobs:
  policy-as-code:
    name: OPA / Conftest policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate hardened manifests
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            "$CONFTEST_IMAGE" \
            test k8s/hardened --policy policy

      - name: Prove vulnerable manifests are rejected
        run: |
          if docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            "$CONFTEST_IMAGE" \
            test k8s/vulnerable --policy policy; then
            echo "::error::The intentionally vulnerable manifest unexpectedly passed policy checks"
            exit 1
          else
            echo "Vulnerable baseline was correctly blocked by the policy gate"
          fi

  scanner-observability:
    name: Additional IaC scanners
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: policy-as-code
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trivy Kubernetes config scan
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            "$TRIVY_IMAGE" \
            config --severity HIGH,CRITICAL --exit-code 0 /project/k8s/hardened

      - name: Checkov Kubernetes scan
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            "$CHECKOV_IMAGE" \
            -d /project/k8s/hardened \
            --framework kubernetes \
            --compact \
            --soft-fail
