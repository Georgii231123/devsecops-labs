apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webservices.platform.example.io
spec:
  group: platform.example.io
  names:
    kind: WebService
    listKind: WebServiceList
    plural: webservices
    singular: webservice
    shortNames: [websvc]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image]
              properties:
                image: {type: string, minLength: 1}
                replicas: {type: integer, format: int32, minimum: 1, maximum: 20, default: 2}
                port: {type: integer, format: int32, minimum: 1, maximum: 65535, default: 8080}
            status:
              type: object
              properties:
                readyReplicas: {type: integer, format: int32}
                observedGeneration: {type: integer, format: int64}
                conditions:
                  type: array
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime: {type: string, format: date-time}
                      message: {type: string}
                      observedGeneration: {type: integer, format: int64}
                      reason: {type: string}
                      status: {type: string, enum: ["True", "False", Unknown]}
                      type: {type: string}
