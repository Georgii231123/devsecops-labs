name: GitLab Lab Smoke Test

on:
  push:
    paths:
      - "gitlab-secure-pipeline/**"
      - ".github/workflows/gitlab-lab.yml"
  pull_request:
    paths:
      - "gitlab-secure-pipeline/**"
      - ".github/workflows/gitlab-lab.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitlab-secure-pipeline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: gitlab-secure-pipeline/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: bandit -r app -q -ll
