name: Industrial Cyber Range

on:
  push:
    branches: [main]
    paths:
      - 'industrial-cyber-range/**'
      - '.github/workflows/industrial-cyber-range.yml'
  pull_request:
    paths:
      - 'industrial-cyber-range/**'
      - '.github/workflows/industrial-cyber-range.yml'

permissions:
  contents: read

jobs:
  quality-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: industrial-cyber-range
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: industrial-cyber-range/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Bandit
        run: bandit -q -r otlab scripts -ll
      - name: Architecture contract
        run: python scripts/validate_architecture.py
      - name: Validate Compose model
        run: docker compose config -q

  protocol-and-incident-drills:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: quality-and-contracts
    defaults:
      run:
        working-directory: industrial-cyber-range
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: industrial-cyber-range/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Modbus TCP integration
        run: python scripts/modbus_smoke.py
      - name: OPC UA integration
        run: python scripts/opcua_smoke.py
      - name: Start MQTT broker
        run: |
          docker compose up -d mqtt
          python - <<'PY'
          import socket
          import time

          for _ in range(30):
              try:
                  with socket.create_connection(('127.0.0.1', 1883), timeout=1):
                      print('MQTT broker is ready')
                      break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('MQTT broker did not become ready')
          PY
      - name: MQTT integration
        run: python scripts/mqtt_smoke.py
      - name: Incident drills
        run: |
          python scripts/incident_drill.py --scenario unauthorized-modbus-write
          python scripts/incident_drill.py --scenario high-pressure
          python - <<'PY'
          import json
          from pathlib import Path

          unauthorized = json.loads(
              Path('artifacts/unauthorized-modbus-write.json').read_text(encoding='utf-8')
          )
          pressure = json.loads(Path('artifacts/high-pressure.json').read_text(encoding='utf-8'))
          assert len(unauthorized['alerts']) >= 2
          assert pressure['process_state']['safe_state'] is True
          print('Incident evidence contract: OK')
          PY
      - name: Upload incident evidence
        uses: actions/upload-artifact@v7
        with:
          name: industrial-cyber-range-evidence
          path: industrial-cyber-range/artifacts/*.json
      - name: Broker logs on failure
        if: failure()
        run: docker compose logs --no-color mqtt
      - name: Cleanup
        if: always()
        run: docker compose down -v
