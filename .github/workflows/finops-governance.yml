name: FinOps Governance

on:
  push:
    branches: [main]
    paths:
      - 'finops-governance/**'
      - '.github/workflows/finops-governance.yml'
  pull_request:
    paths:
      - 'finops-governance/**'
      - '.github/workflows/finops-governance.yml'

permissions:
  contents: read

jobs:
  cost-and-resource-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finops-governance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Unit tests
        run: pytest -q
      - name: Budget forecast gate
        run: python scripts/budget_guard.py
      - name: Kubernetes allocation policy
        run: python scripts/resource_policy.py
      - name: Trivy manifest review
        run: docker run --rm -v "$PWD:/src" aquasec/trivy:latest config --exit-code 0 /src/k8s
      - name: Upload FinOps report
        uses: actions/upload-artifact@v7
        with:
          name: finops-budget-report
          path: finops-governance/artifacts/finops-report.md
