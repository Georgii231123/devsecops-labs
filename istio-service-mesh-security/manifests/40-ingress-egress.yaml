apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: mesh-lab
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - mesh-lab.example.com
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: frontend
  namespace: mesh-lab
spec:
  hosts:
    - mesh-lab.example.com
  gateways:
    - public-gateway
  http:
    - route:
        - destination:
            host: frontend.mesh-lab.svc.cluster.local
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: default
  namespace: mesh-lab
spec:
  egress:
    - hosts:
        - "./*"
        - "istio-system/*"
