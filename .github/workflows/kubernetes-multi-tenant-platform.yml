name: Kubernetes Multi-Tenant Platform

on:
  push:
    branches: [main]
    paths:
      - 'kubernetes-multi-tenant-platform/**'
      - '.github/workflows/kubernetes-multi-tenant-platform.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kubernetes-multi-tenant-platform/**'
      - '.github/workflows/kubernetes-multi-tenant-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tenant-isolation:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kubernetes-multi-tenant-platform
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Render tenant platform
        run: python scripts/render_tenants.py --out-dir build
      - name: Validate platform contract
        run: python scripts/validate_contract.py build
      - name: Unit regression
        run: python -m pytest -q
      - name: Install pinned kind
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-amd64
          echo '50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  kind' | sha256sum -c -
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Create disposable cluster
        run: kind create cluster --name tenancy --wait 120s
      - name: Apply tenant resources
        run: kubectl apply -f build/payments.yaml -f build/analytics.yaml
      - name: Prove namespace RBAC isolation
        run: |
          kubectl auth can-i create deployments.apps -n payments --as=alice --as-group=tenant:payments:developers | grep -qx yes
          kubectl auth can-i create deployments.apps -n analytics --as=alice --as-group=tenant:payments:developers | grep -qx no
          kubectl auth can-i get secrets -n payments --as=alice --as-group=tenant:payments:developers | grep -qx no
      - name: Prove Pod Security contract
        run: |
          kubectl apply --dry-run=server -f fixtures/safe-pod.yaml >/dev/null
          if kubectl apply --dry-run=server -f fixtures/privileged-pod.yaml >/tmp/privileged.out 2>&1; then
            cat /tmp/privileged.out
            echo 'privileged workload unexpectedly passed restricted Pod Security'
            exit 1
          fi
          cat /tmp/privileged.out
