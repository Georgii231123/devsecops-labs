name: Vault Secrets Platform

on:
  push:
    branches: [main]
    paths:
      - 'vault-secrets-platform/**'
      - '.github/workflows/vault-secrets.yml'
  pull_request:
    paths:
      - 'vault-secrets-platform/**'
      - '.github/workflows/vault-secrets.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vault-secrets-platform
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose
        run: docker compose config >/dev/null
      - name: Shell syntax
        run: bash -n scripts/*.sh
      - name: Start Vault
        run: |
          docker compose up -d vault
          for _ in {1..30}; do
            if docker compose exec -T -e VAULT_ADDR=http://127.0.0.1:8200 vault vault status >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose logs vault
          exit 1
      - name: Write policy and verify secret
        run: ./scripts/bootstrap-dev.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs vault
