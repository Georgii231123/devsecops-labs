groups:
  - name: service-sli
    interval: 30s
    rules:
      - record: service:http_requests:rate5m
        expr: sum(rate(http_requests_total[5m]))
      - record: service:http_errors:rate5m
        expr: sum(rate(http_requests_total{status=~"5.."}[5m]))
      - record: service:error_ratio5m
        expr: service:http_errors:rate5m / clamp_min(service:http_requests:rate5m, 0.001)
      - record: service:availability5m
        expr: 1 - service:error_ratio5m

  - name: service-alerts
    rules:
      - alert: DemoServiceHighErrorRate
        expr: service:error_ratio5m > 0.05
        for: 2m
        labels:
          severity: warning
          service: observability-demo
        annotations:
          summary: Demo service error ratio is above 5%
          runbook: docs/runbook.md#high-error-rate

      - alert: DemoServiceDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
          service: observability-demo
        annotations:
          summary: Prometheus cannot scrape the demo service
          runbook: docs/runbook.md#service-down

      - alert: DemoServiceP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: p95 latency is above 500ms
          runbook: docs/runbook.md#high-latency
