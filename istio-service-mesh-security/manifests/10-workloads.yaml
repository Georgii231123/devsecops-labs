apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: mesh-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: mesh-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mesh-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      serviceAccountName: frontend
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: python:3.13-alpine
          command: ["python", "-m", "http.server", "8080"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: mesh-lab
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: mesh-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
      version: v1
