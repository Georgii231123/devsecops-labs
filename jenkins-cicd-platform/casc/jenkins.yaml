jenkins:
  systemMessage: "Managed by JCasC. Manual controller configuration is not authoritative."
  numExecutors: 0
  mode: EXCLUSIVE
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"
              - "Job/Read"

security:
  queueItemAuthenticator:
    authenticators: []

unclassified:
  location:
    url: "http://localhost:8080/"
  globalLibraries:
    libraries:
      - name: "devops-shared-library"
        defaultVersion: "main"
        implicit: false
        allowVersionOverride: true
        retriever:
          modernSCM:
            scm:
              git:
                remote: "https://github.com/Georgii231123/devsecops-labs.git"
