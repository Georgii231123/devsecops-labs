name: Kyverno Admission Control

on:
  push:
    branches: [main]
    paths:
      - 'kyverno-admission-control/**'
      - '.github/workflows/kyverno-admission-control.yml'
  pull_request:
    paths:
      - 'kyverno-admission-control/**'
      - '.github/workflows/kyverno-admission-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-policy-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kyverno-admission-control
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install contract dependencies
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Validate platform contract
        run: python scripts/validate_contract.py
      - name: Install Kyverno CLI 1.18.2 with checksum verification
        run: |
          curl -fsSLO https://github.com/kyverno/kyverno/releases/download/v1.18.2/kyverno-cli_v1.18.2_linux_x86_64.tar.gz
          curl -fsSL https://github.com/kyverno/kyverno/releases/download/v1.18.2/checksums.txt -o checksums.txt
          grep ' kyverno-cli_v1.18.2_linux_x86_64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf kyverno-cli_v1.18.2_linux_x86_64.tar.gz
          sudo install -m 0755 kyverno /usr/local/bin/kyverno
          kyverno version
      - name: Prove safe workload is admitted
        run: |
          kyverno apply policies/disallow-privileged.yaml --resource fixtures/good.yaml > /tmp/good-privileged.txt
          kyverno apply policies/require-nonroot.yaml --resource fixtures/good.yaml > /tmp/good-nonroot.txt
          kyverno apply policies/disallow-latest.yaml --resource fixtures/good.yaml > /tmp/good-tag.txt
          kyverno apply policies/require-runtime-controls.yaml --resource fixtures/good.yaml > /tmp/good-runtime.txt
          kyverno apply policies/disallow-hostpath.yaml --resource fixtures/good.yaml > /tmp/good-hostpath.txt
          cat /tmp/good-*.txt
      - name: Prove unsafe workloads are rejected
        run: |
          check_fail() {
            policy="$1"; resource="$2"; name="$3"
            kyverno apply "$policy" --resource "$resource" > "/tmp/${name}.txt" || true
            cat "/tmp/${name}.txt"
            grep -Eiq 'fail[^0-9]*[1-9]' "/tmp/${name}.txt"
          }
          check_fail policies/disallow-privileged.yaml fixtures/bad-privileged.yaml privileged
          check_fail policies/require-nonroot.yaml fixtures/bad-root.yaml root
          check_fail policies/disallow-latest.yaml fixtures/bad-latest.yaml latest
          check_fail policies/require-runtime-controls.yaml fixtures/bad-resources.yaml runtime
          check_fail policies/disallow-hostpath.yaml fixtures/bad-hostpath.yaml hostpath
      - name: Validate mutate and generate policy syntax
        run: |
          kyverno apply policies/add-seccomp.yaml --resource fixtures/bad-root.yaml > /tmp/mutate.txt
          grep -q 'RuntimeDefault' <(kyverno apply policies/add-seccomp.yaml --resource fixtures/bad-root.yaml --output yaml)
          kyverno apply policies/generate-default-deny.yaml --resource <(printf '%s\n' 'apiVersion: v1' 'kind: Namespace' 'metadata:' '  name: demo' '  labels:' '    network-policy: default-deny') > /tmp/generate.txt
