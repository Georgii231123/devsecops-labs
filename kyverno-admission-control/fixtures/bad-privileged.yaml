apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-api
spec:
  selector:
    matchLabels: {app: privileged-api}
  template:
    metadata:
      labels: {app: privileged-api}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: nginx:1.29.1
          securityContext:
            privileged: true
