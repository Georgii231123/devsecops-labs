name: Platform Engineering Golden Path

on:
  push:
    branches: [main]
    paths:
      - 'platform-engineering/**'
      - '.github/workflows/platform-engineering.yml'
  pull_request:
    paths:
      - 'platform-engineering/**'
      - '.github/workflows/platform-engineering.yml'

permissions:
  contents: read

jobs:
  test-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform-engineering
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: platform-engineering/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Generate and validate example service
        run: |
          python bootstrap.py inventory-api --owner inventory-team --output /tmp/platform-generated
          python scripts/validate_service.py /tmp/platform-generated/inventory-api
          python -m py_compile /tmp/platform-generated/inventory-api/app/main.py
