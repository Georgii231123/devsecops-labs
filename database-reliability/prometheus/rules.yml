groups:
  - name: postgres-reliability
    rules:
      - alert: PostgreSQLExporterDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL exporter is unavailable
          runbook: docs/runbook.md#database-or-exporter-down

      - alert: PostgreSQLHighConnectionUsage
        expr: sum(pg_stat_activity_count) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: PostgreSQL connection usage is elevated
          runbook: docs/runbook.md#high-connection-usage
