name: GitOps Argo CD Platform

on:
  push:
    branches: [main]
    paths:
      - 'gitops-argocd-platform/**'
      - '.github/workflows/gitops-platform.yml'
  pull_request:
    paths:
      - 'gitops-argocd-platform/**'
      - '.github/workflows/gitops-platform.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gitops-argocd-platform
    steps:
      - uses: actions/checkout@v7
      - name: Render dev and prod
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 lint charts/demo-service -f environments/dev/values.yaml
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 template demo-dev charts/demo-service -f environments/dev/values.yaml > /tmp/dev.yaml
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 lint charts/demo-service -f environments/prod/values.yaml
          docker run --rm -v "$PWD:/work" -w /work alpine/helm:3.17.3 template demo-prod charts/demo-service -f environments/prod/values.yaml > /tmp/prod.yaml
      - name: Reject mutable image tags
        run: |
          if grep -R -E '^[[:space:]]*tag:.*latest' environments; then
            echo "mutable latest image tag is forbidden"
            exit 1
          fi
      - name: Trivy rendered Kubernetes manifests
        run: |
          docker run --rm -v /tmp:/rendered aquasec/trivy:0.74.0 config --exit-code 0 /rendered/dev.yaml
          docker run --rm -v /tmp:/rendered aquasec/trivy:0.74.0 config --exit-code 0 /rendered/prod.yaml
