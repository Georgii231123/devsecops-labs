name: Observability SRE Lab

on:
  push:
    branches: [main]
    paths:
      - 'observability-sre/**'
      - '.github/workflows/observability-sre.yml'
  pull_request:
    paths:
      - 'observability-sre/**'
      - '.github/workflows/observability-sre.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: observability-sre
    steps:
      - uses: actions/checkout@v6
      - name: Python syntax
        run: python -m py_compile app/app.py
      - name: Compose validation
        run: docker compose config -q
      - name: Prometheus config structure
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" prom/prometheus:v3.5.0 promtool check rules /etc/prometheus/rules.yml
