apiVersion: apps/v1
kind: Deployment
metadata:
  name: latest-api
spec:
  selector:
    matchLabels: {app: latest-api}
  template:
    metadata:
      labels: {app: latest-api}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: nginx:latest
          securityContext:
            privileged: false
